<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Hub — GridMaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --g:#00c853; --g2:#00e676; --g3:#1b5e20; --g4:#2e7d32;
    --blk:#0a0a0a; --blk2:#111; --blk3:#1a1a1a; --blk4:#222; --blk5:#2d2d2d;
    --wht:#fff; --wht2:#e8e8e8; --wht3:#b0b0b0;
    --red:#f44336; --yellow:#ffd600; --orange:#ff6d00; --teal:#00bfa5;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--blk); color:var(--wht); font-family:'Barlow',sans-serif; min-height:100vh; padding-bottom:60px; }
  h1,h2,h3 { font-family:'Bebas Neue',sans-serif; letter-spacing:1px; }

  #topbar {
    background:var(--blk2); border-bottom:1px solid var(--blk5);
    padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:50;
  }
  #topbar h1 { font-size:26px; color:var(--g2); letter-spacing:2px; }
  #topbar .sub { color:var(--wht3); font-size:12px; font-family:'Barlow Condensed',sans-serif; letter-spacing:1px; }
  .tb-input {
    background:var(--blk4); border:1px solid var(--blk5); color:var(--wht);
    border-radius:6px; padding:8px 10px; font-size:14px; font-family:'Barlow',sans-serif;
  }
  .tb-input::placeholder { color:var(--wht3); }
  .tb-btn {
    background:var(--g3); border:1px solid var(--g); color:var(--g2);
    border-radius:6px; padding:8px 14px; font-size:13px; font-weight:700; letter-spacing:1px;
    cursor:pointer; font-family:'Barlow Condensed',sans-serif;
  }
  .tb-btn:hover { background:var(--g4); }

  #conn-line { width:100%; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--wht3); font-family:'Barlow Condensed',sans-serif; }
  #conn-dot { width:8px; height:8px; border-radius:50%; background:var(--wht3); }
  #conn-dot.live { background:var(--g2); box-shadow:0 0 6px var(--g); }
  #conn-dot.waiting { background:var(--yellow); }
  #conn-dot.error { background:var(--red); }

  #tabs { display:flex; gap:0; background:var(--blk2); border-bottom:1px solid var(--blk5); overflow-x:auto; }
  .tab-btn {
    flex:1; min-width:110px; background:none; border:none; color:var(--wht3); padding:14px 10px;
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; letter-spacing:1px;
    cursor:pointer; border-bottom:3px solid transparent;
  }
  .tab-btn.active { color:var(--g2); border-bottom-color:var(--g2); }

  #content { max-width:960px; margin:0 auto; padding:20px 16px; }
  .panel { display:none; }
  .panel.active { display:block; }

  .card { background:var(--blk2); border:1px solid var(--blk5); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card-title { font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:1px; color:var(--wht3); font-size:13px; margin-bottom:10px; text-transform:uppercase; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:var(--wht3); font-family:'Barlow Condensed',sans-serif; font-size:12px; letter-spacing:1px; padding:8px 6px; border-bottom:1px solid var(--blk5); text-transform:uppercase; }
  td { padding:9px 6px; border-bottom:1px solid var(--blk4); }
  tr:hover td { background:var(--blk3); }
  .num-col { text-align:center; }
  .team-cell { display:flex; align-items:center; gap:8px; }
  .team-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .team-link { color:var(--wht2); text-decoration:none; cursor:pointer; }
  .team-link:hover { color:var(--g2); }

  .leader-select { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .leader-select select { background:var(--blk4); border:1px solid var(--blk5); color:var(--wht); border-radius:6px; padding:8px 10px; font-size:14px; }
  .leader-row { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--blk4); }
  .leader-rank { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--wht3); width:26px; text-align:center; }
  .leader-name { flex:1; }
  .leader-team { color:var(--wht3); font-size:12px; }
  .leader-val { font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--g2); }

  .team-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:12px; }
  .team-card { background:var(--blk3); border:1px solid var(--blk5); border-radius:10px; padding:14px; cursor:pointer; text-align:center; }
  .team-card:hover { border-color:var(--g); }
  .team-card .tc-name { font-family:'Bebas Neue',sans-serif; font-size:18px; margin-top:6px; }
  .team-card .tc-rec { color:var(--wht3); font-size:13px; margin-top:4px; }

  .sched-row { display:flex; align-items:center; justify-content:space-between; padding:10px 6px; border-bottom:1px solid var(--blk4); cursor:pointer; }
  .sched-row:hover { background:var(--blk3); }
  .sched-teams { display:flex; align-items:center; gap:8px; font-size:14px; }
  .sched-score { font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--g2); }
  .sched-date { color:var(--wht3); font-size:12px; font-family:'Barlow Condensed',sans-serif; }

  #empty-state { text-align:center; padding:60px 20px; color:var(--wht3); }
  #empty-state h2 { color:var(--wht2); margin-bottom:8px; }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:500; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--blk2); border:1px solid var(--blk5); border-radius:12px; padding:20px; max-width:600px; width:100%; max-height:85vh; overflow-y:auto; }
  .modal-title { font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--g2); margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .modal-close { background:none; border:none; color:var(--wht3); font-size:20px; cursor:pointer; }
  .stat-cat-lbl { font-family:'Barlow Condensed',sans-serif; font-size:12px; color:var(--wht3); letter-spacing:1px; margin:12px 0 6px; text-transform:uppercase; }
</style>
</head>
<body>

<div id="topbar">
  <h1>LEAGUE HUB</h1>
  <input class="tb-input" id="league-id-input" placeholder="League ID" style="width:140px;">
  <select class="tb-input" id="season-select" style="width:120px;"></select>
  <button class="tb-btn" onclick="loadLeague()">LOAD</button>
  <div id="conn-line"><span id="conn-dot"></span><span id="conn-text">Enter a League ID to begin</span></div>
</div>

<div id="tabs" style="display:none;">
  <button class="tab-btn active" onclick="switchTab('standings')" id="tab-standings">STANDINGS</button>
  <button class="tab-btn" onclick="switchTab('leaders')" id="tab-leaders">LEADERS</button>
  <button class="tab-btn" onclick="switchTab('teams')" id="tab-teams">TEAMS</button>
  <button class="tab-btn" onclick="switchTab('schedule')" id="tab-schedule">SCHEDULE</button>
</div>

<div id="content">

  <div id="empty-state">
    <h2>No league loaded</h2>
    <p>Enter your League ID above and click LOAD to see standings, leaders, teams, and schedule.</p>
  </div>

  <div class="panel" id="panel-standings">
    <div class="card">
      <div class="card-title">STANDINGS</div>
      <table>
        <thead><tr><th>TEAM</th><th class="num-col">W</th><th class="num-col">L</th><th class="num-col">T</th><th class="num-col">PF</th><th class="num-col">PA</th><th class="num-col">DIFF</th></tr></thead>
        <tbody id="standings-body"></tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="panel-leaders">
    <div class="card">
      <div class="card-title">LEAGUE LEADERS</div>
      <div class="leader-select">
        <select id="leader-category" onchange="renderLeaders()"></select>
      </div>
      <div id="leaders-list"></div>
    </div>
  </div>

  <div class="panel" id="panel-teams">
    <div class="card">
      <div class="card-title">TEAMS</div>
      <div class="team-grid" id="teams-grid"></div>
    </div>
  </div>

  <div class="panel" id="panel-schedule">
    <div class="card">
      <div class="card-title">SCHEDULE / RESULTS</div>
      <div id="schedule-list"></div>
    </div>
  </div>

</div>

<!-- BOX SCORE MODAL -->
<div class="modal-overlay" id="box-modal">
  <div class="modal">
    <div class="modal-title"><span id="box-title">BOX SCORE</span>
      <button class="modal-close" onclick="closeModal('box-modal')">✕</button>
    </div>
    <div id="box-body"></div>
  </div>
</div>

<!-- TEAM MODAL -->
<div class="modal-overlay" id="team-modal">
  <div class="modal">
    <div class="modal-title"><span id="team-modal-title">TEAM</span>
      <button class="modal-close" onclick="closeModal('team-modal')">✕</button>
    </div>
    <div id="team-modal-body"></div>
  </div>
</div>

<script>
const FB_CONFIG = {
  apiKey:            "AIzaSyDykV8iQukxY00gDkBllu06bDgqak_6zk4",
  authDomain:        "gridmaster-live.firebaseapp.com",
  databaseURL:       "https://gridmaster-live-default-rtdb.firebaseio.com",
  projectId:         "gridmaster-live",
  storageBucket:     "gridmaster-live.firebasestorage.app",
  messagingSenderId: "186706105208",
  appId:             "1:186706105208:web:0baab38c7a018a86d7ae8d"
};

let fbDb = null;
let currentLeagueId = null;
let teamsData = {};   // slug -> {name, abbr, color}
let gamesData = {};   // gameId -> game record
let standings = {};   // slug -> {w,l,t,pf,pa}
let playerTotals = {}; // "slug__num" -> aggregated stats

const LEADER_CATEGORIES = [
  { key:'pass_yds',  label:'Passing Yards',    cat:'passing',   field:'yds' },
  { key:'pass_td',   label:'Passing TDs',      cat:'passing',   field:'td'  },
  { key:'rush_yds',  label:'Rushing Yards',    cat:'rushing',   field:'yds' },
  { key:'rush_td',   label:'Rushing TDs',      cat:'rushing',   field:'td'  },
  { key:'recv_yds',  label:'Receiving Yards',  cat:'receiving', field:'yds' },
  { key:'recv_td',   label:'Receiving TDs',    cat:'receiving', field:'td'  },
  { key:'tackles',   label:'Tackles',          cat:'defense',   field:'tot' },
  { key:'sacks',     label:'Sacks',            cat:'defense',   field:'sacks' },
  { key:'ints',      label:'Interceptions',    cat:'defense',   field:'ints' },
  { key:'fg_made',   label:'Field Goals Made', cat:'kicking',   field:'fg_made' },
];

function loadScripts(urls) {
  return urls.reduce((p, url) => p.then(() => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  })), Promise.resolve());
}

function setConn(status, text) {
  document.getElementById('conn-dot').className = status;
  document.getElementById('conn-text').textContent = text;
}

function toArray(val) {
  if(!val) return [];
  if(Array.isArray(val)) return val;
  return Object.keys(val).map(k => val[k]).filter(v => v != null);
}

// ── Init Firebase, then wait for user to load a league ──
loadScripts([
  'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
  'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js'
]).then(() => {
  const fbApp = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(FB_CONFIG);
  fbDb = fbApp.database();

  // Populate leader category dropdown
  const sel = document.getElementById('leader-category');
  sel.innerHTML = LEADER_CATEGORIES.map(c => `<option value="${c.key}">${c.label}</option>`).join('');

  // Auto-load from URL params (?league=X&season=Y) or localStorage, for easy embedding
  const params = new URLSearchParams(location.search);
  const savedLeague = params.get('league') || localStorage.getItem('gm_hub_league') || '';
  document.getElementById('league-id-input').value = savedLeague;
  if(savedLeague) loadLeague(params.get('season'));

}).catch(err => {
  setConn('error', 'FAILED TO LOAD FIREBASE');
  console.error(err);
});

async function loadLeague(preferredSeason) {
  const leagueId = document.getElementById('league-id-input').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
  if(!leagueId) { setConn('error','Enter a League ID'); return; }
  if(!fbDb) { setConn('error','Firebase not ready yet — try again'); return; }

  currentLeagueId = leagueId;
  localStorage.setItem('gm_hub_league', leagueId);
  setConn('waiting', 'Loading league "' + leagueId + '"...');

  try {
    const teamsSnap = await fbDb.ref(`leagues/${leagueId}/teams`).once('value');
    teamsData = teamsSnap.val() || {};

    const seasonsSnap = await fbDb.ref(`leagues/${leagueId}/seasons`).once('value');
    const seasons = seasonsSnap.val() || {};
    const seasonIds = Object.keys(seasons);

    const seasonSel = document.getElementById('season-select');
    seasonSel.innerHTML = seasonIds.map(s => {
      const lbl = seasons[s]?.meta?.label;
      return `<option value="${s}">${lbl ? lbl : s}</option>`;
    }).join('');

    if(!seasonIds.length) {
      setConn('waiting', 'No games submitted for "' + leagueId + '" yet');
      document.getElementById('empty-state').style.display = 'block';
      document.getElementById('tabs').style.display = 'none';
      return;
    }

    const seasonId = (preferredSeason && seasonIds.includes(preferredSeason)) ? preferredSeason : seasonIds[seasonIds.length - 1];
    seasonSel.value = seasonId;
    seasonSel.onchange = () => loadSeason(leagueId, seasonSel.value);

    loadSeason(leagueId, seasonId);
  } catch(e) {
    setConn('error', 'Load failed: ' + (e.message || e));
  }
}

function loadSeason(leagueId, seasonId) {
  fbDb.ref(`leagues/${leagueId}/seasons/${seasonId}/games`).on('value', snap => {
    gamesData = snap.val() || {};
    computeAll();
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('tabs').style.display = 'flex';
    setConn('live', Object.keys(gamesData).length + ' game(s) loaded — LIVE');
    renderStandings();
    renderLeaders();
    renderTeams();
    renderSchedule();
  }, err => {
    setConn('error', 'Sync error: ' + (err.message || err));
  });
}

// ── Aggregate all games into standings + player totals ──
// This is a full replay every time data changes (never incremental counters),
// so correcting/resubmitting a single game is always safe and never double-counts.
function computeAll() {
  standings = {};
  playerTotals = {};

  const ensureTeam = (slug) => {
    if(!standings[slug]) standings[slug] = { w:0, l:0, t:0, pf:0, pa:0 };
  };

  Object.values(gamesData).forEach(g => {
    if(!g || !g.teamA || !g.teamB) return;
    const sa = g.scores?.a ?? 0, sb = g.scores?.b ?? 0;
    ensureTeam(g.teamA); ensureTeam(g.teamB);

    standings[g.teamA].pf += sa; standings[g.teamA].pa += sb;
    standings[g.teamB].pf += sb; standings[g.teamB].pa += sa;

    if(sa > sb)      { standings[g.teamA].w++; standings[g.teamB].l++; }
    else if(sb > sa) { standings[g.teamB].w++; standings[g.teamA].l++; }
    else              { standings[g.teamA].t++; standings[g.teamB].t++; }

    ['a','b'].forEach(side => {
      const slug = side === 'a' ? g.teamA : g.teamB;
      const sideStats = g.stats?.[side] || {};
      ['passing','rushing','receiving','defense','kicking'].forEach(cat => {
        toArray(sideStats[cat]).forEach(p => {
          if(!p || (p.num == null && !p.name)) return;
          const key = `${slug}__${p.num ?? p.name}`;
          if(!playerTotals[key]) playerTotals[key] = { num:p.num, name:p.name, team:slug, passing:{}, rushing:{}, receiving:{}, defense:{}, kicking:{} };
          const bucket = playerTotals[key][cat];
          Object.entries(p).forEach(([k,v]) => {
            if(k === 'num' || k === 'name') return;
            if(typeof v === 'number') bucket[k] = (bucket[k]||0) + v;
          });
        });
      });
    });
  });
}

function teamLabel(slug) {
  const t = teamsData[slug];
  return t ? (t.name || slug) : slug;
}
function teamAbbr(slug) {
  const t = teamsData[slug];
  return t ? (t.abbr || slug.toUpperCase()) : slug.toUpperCase();
}
function teamColor(slug) {
  return (teamsData[slug] && teamsData[slug].color) || 'var(--wht3)';
}

// ── Tabs ──
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}
switchTab('standings');

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── Standings ──
function renderStandings() {
  const rows = Object.entries(standings).map(([slug, s]) => ({ slug, ...s, diff: s.pf - s.pa }))
    .sort((a,b) => (b.w - a.w) || (b.diff - a.diff));
  document.getElementById('standings-body').innerHTML = rows.map(r => `
    <tr>
      <td><div class="team-cell"><span class="team-dot" style="background:${teamColor(r.slug)}"></span>
        <span class="team-link" onclick="openTeamModal('${r.slug}')">${teamLabel(r.slug)}</span></div></td>
      <td class="num-col">${r.w}</td><td class="num-col">${r.l}</td><td class="num-col">${r.t}</td>
      <td class="num-col">${r.pf}</td><td class="num-col">${r.pa}</td>
      <td class="num-col" style="color:${r.diff>0?'var(--g2)':r.diff<0?'var(--red)':'var(--wht3)'}">${r.diff>0?'+':''}${r.diff}</td>
    </tr>`).join('') || '<tr><td colspan="7" style="color:var(--wht3);text-align:center;padding:20px;">No games yet</td></tr>';
}

// ── Leaders ──
function renderLeaders() {
  const catKey = document.getElementById('leader-category').value;
  const cfg = LEADER_CATEGORIES.find(c => c.key === catKey) || LEADER_CATEGORIES[0];
  const rows = Object.values(playerTotals)
    .map(p => ({ ...p, val: p[cfg.cat]?.[cfg.field] || 0 }))
    .filter(p => p.val > 0)
    .sort((a,b) => b.val - a.val)
    .slice(0, 15);

  document.getElementById('leaders-list').innerHTML = rows.map((p,i) => `
    <div class="leader-row">
      <div class="leader-rank">${i+1}</div>
      <span class="team-dot" style="background:${teamColor(p.team)}"></span>
      <div class="leader-name">#${p.num ?? '—'} ${p.name || 'Unknown'} <span class="leader-team">${teamAbbr(p.team)}</span></div>
      <div class="leader-val">${p.val}</div>
    </div>`).join('') || '<div style="color:var(--wht3);padding:16px 0;">No data yet for this category</div>';
}

// ── Teams ──
function renderTeams() {
  const slugs = new Set([...Object.keys(teamsData), ...Object.keys(standings)]);
  document.getElementById('teams-grid').innerHTML = [...slugs].map(slug => {
    const s = standings[slug] || {w:0,l:0,t:0};
    return `<div class="team-card" onclick="openTeamModal('${slug}')">
      <span class="team-dot" style="background:${teamColor(slug)};display:inline-block;width:16px;height:16px;border-radius:50%;"></span>
      <div class="tc-name">${teamLabel(slug)}</div>
      <div class="tc-rec">${s.w}-${s.l}${s.t?'-'+s.t:''}</div>
    </div>`;
  }).join('') || '<div style="color:var(--wht3);">No teams yet</div>';
}

function openTeamModal(slug) {
  const s = standings[slug] || {w:0,l:0,t:0,pf:0,pa:0};
  document.getElementById('team-modal-title').textContent = teamLabel(slug);
  const roster = Object.values(playerTotals).filter(p => p.team === slug)
    .sort((a,b) => (a.num ?? 999) - (b.num ?? 999));
  const teamGames = Object.entries(gamesData).filter(([id,g]) => g.teamA === slug || g.teamB === slug);
  document.getElementById('team-modal-body').innerHTML = `
    <div style="margin-bottom:14px;color:var(--wht3);">Record: ${s.w}-${s.l}${s.t?'-'+s.t:''} · PF ${s.pf} · PA ${s.pa}</div>
    <div class="stat-cat-lbl">GAMES (${teamGames.length})</div>
    ${teamGames.map(([id,g]) => {
      const opp = g.teamA === slug ? g.teamB : g.teamA;
      const my  = g.teamA === slug ? g.scores?.a : g.scores?.b;
      const th  = g.teamA === slug ? g.scores?.b : g.scores?.a;
      return `<div style="padding:6px 0;border-bottom:1px solid var(--blk4);cursor:pointer;" onclick="openBoxScore('${id}')">vs ${teamLabel(opp)} — ${my ?? '—'}-${th ?? '—'}</div>`;
    }).join('') || '<div style="color:var(--wht3);">None yet</div>'}
    <div class="stat-cat-lbl">ROSTER TOTALS (SEASON)</div>
    ${roster.map(p => `<div style="padding:4px 0;font-size:13px;">#${p.num ?? '—'} ${p.name} —
      ${p.passing?.yds ? 'PASS ' + p.passing.yds + 'yds/' + (p.passing.td||0) + 'td ' : ''}
      ${p.rushing?.yds ? 'RUSH ' + p.rushing.yds + 'yds/' + (p.rushing.td||0) + 'td ' : ''}
      ${p.receiving?.yds ? 'REC ' + p.receiving.yds + 'yds/' + (p.receiving.td||0) + 'td ' : ''}
      ${p.defense?.tot ? 'TKL ' + p.defense.tot + ' ' : ''}
      ${p.defense?.sacks ? 'SACK ' + p.defense.sacks + ' ' : ''}
      ${p.defense?.ints ? 'INT ' + p.defense.ints + ' ' : ''}</div>`).join('') || '<div style="color:var(--wht3);">No stats yet</div>'}
  `;
  document.getElementById('team-modal').classList.add('open');
}

// ── Schedule ──
function renderSchedule() {
  const rows = Object.entries(gamesData).sort((a,b) => (b[1].ts||0) - (a[1].ts||0));
  document.getElementById('schedule-list').innerHTML = rows.map(([id,g]) => `
    <div class="sched-row" onclick="openBoxScore('${id}')">
      <div class="sched-teams">
        <span class="team-dot" style="background:${teamColor(g.teamA)}"></span>${teamAbbr(g.teamA)}
        <span style="color:var(--wht3);">@</span>
        <span class="team-dot" style="background:${teamColor(g.teamB)}"></span>${teamAbbr(g.teamB)}
      </div>
      <div class="sched-score">${g.scores?.a ?? '—'} - ${g.scores?.b ?? '—'}</div>
      <div class="sched-date">${g.ts ? new Date(g.ts).toLocaleDateString() : ''}</div>
    </div>`).join('') || '<div style="color:var(--wht3);padding:16px 0;">No games yet</div>';
}

function openBoxScore(gameId) {
  const g = gamesData[gameId];
  if(!g) return;
  document.getElementById('box-title').textContent = `${teamAbbr(g.teamA)} ${g.scores?.a ?? 0} — ${g.scores?.b ?? 0} ${teamAbbr(g.teamB)}`;
  const statBlock = (side, slug) => {
    const st = g.stats?.[side] || {};
    const cats = [
      ['PASSING', st.passing, p => `${p.name} — ${p.cmp||0}/${p.att||0}, ${p.yds||0}yds, ${p.td||0}td, ${p.int||0}int`],
      ['RUSHING', st.rushing, p => `${p.name} — ${p.car||0}car, ${p.yds||0}yds, ${p.td||0}td`],
      ['RECEIVING', st.receiving, p => `${p.name} — ${p.rec||0}rec, ${p.yds||0}yds, ${p.td||0}td`],
      ['DEFENSE', st.defense, p => `${p.name} — ${p.tot||0}tkl, ${p.sacks||0}sack, ${p.ints||0}int, ${p.pbu||0}pbu`],
    ];
    return `<div class="stat-cat-lbl">${teamLabel(slug)}</div>` + cats.map(([label, arr, fmt]) => {
      const list = toArray(arr).filter(p => p && p.name);
      if(!list.length) return '';
      return `<div style="font-size:12px;color:var(--wht3);margin-top:6px;">${label}</div>` +
        list.map(p => `<div style="font-size:13px;padding:2px 0;">${fmt(p)}</div>`).join('');
    }).join('');
  };
  document.getElementById('box-body').innerHTML = statBlock('a', g.teamA) + statBlock('b', g.teamB);
  document.getElementById('box-modal').classList.add('open');
}
</script>
</body>
</html>
