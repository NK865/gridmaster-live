<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Stat Entry — ENTRY BUILD 2 (Firebase)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eceef0;
  --card:#ffffff;
  --ink:#14181c;
  --ink-2:#5a646e;
  --ink-3:#8a939c;
  --rule:#d3d8dd;
  --rule-2:#e6e9ec;
  --accent:#0d5c63;
  --accent-soft:#e0efef;
  --ovr:#8a5200;
  --ovr-soft:#fdf2dc;
  --calc-bg:#f5f7f8;
  --bad:#9c2a2a;
  --ok:#1d6b3a;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:13px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:8px 14px;background:var(--ink);color:#f2f4f6;
  border-bottom:2px solid var(--accent);
}
.brand{font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase}
.buildtag{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  background:var(--accent);color:#fff;padding:2px 6px;border-radius:2px;
}
.topbar .spacer{flex:1}
.tbtn{
  background:transparent;border:1px solid #3a444e;color:#e6eaee;
  padding:4px 10px;border-radius:3px;font-size:12px;
}
.tbtn:hover:not(:disabled){background:#2a333c;border-color:#55616d}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.primary:hover{background:#0f6f78}
.stat-chip{font-family:var(--mono);font-size:11px;color:#9aa5b0}

.body{display:flex;flex:1;min-height:0}

/* ---------- sidebar ---------- */
.side{
  width:250px;flex:0 0 250px;background:var(--card);
  border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;
}
.side-head{padding:8px;border-bottom:1px solid var(--rule-2);display:flex;flex-direction:column;gap:6px}
.side-head input[type=text]{
  width:100%;padding:5px 7px;border:1px solid var(--rule);border-radius:3px;background:#fff;
}
.side-head input[type=text]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.addrow{display:flex;gap:5px}
.addrow button{
  background:var(--accent);color:#fff;border:none;border-radius:3px;padding:5px 9px;font-size:12px;white-space:nowrap;
}
.plist{flex:1;overflow-y:auto}
.pitem{
  padding:6px 9px;border-bottom:1px solid var(--rule-2);cursor:pointer;
  display:flex;justify-content:space-between;gap:6px;align-items:baseline;
}
.pitem:hover{background:var(--calc-bg)}
.pitem.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.pitem .pn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .pm{font-family:var(--mono);font-size:10px;color:var(--ink-3);white-space:nowrap}
.empty{padding:18px 12px;color:var(--ink-3);font-size:12px}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.mainscroll{flex:1;overflow:auto;padding:12px 14px 40px}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:4px;margin-bottom:12px}
.panel > h2{
  margin:0;padding:7px 11px;border-bottom:1px solid var(--rule-2);
  font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);
  display:flex;align-items:center;gap:10px;
}
.panel > h2 .h2act{margin-left:auto;display:flex;gap:6px}
.panel-in{padding:10px 11px}

.mini{
  background:#fff;border:1px solid var(--rule);border-radius:3px;
  padding:3px 8px;font-size:11px;color:var(--ink-2);
}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.danger:hover{border-color:var(--bad);color:var(--bad)}

/* bio */
.bio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-family:var(--cond);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.fld input,.fld select,.fld textarea{
  border:1px solid var(--rule);border-radius:3px;padding:4px 6px;background:#fff;width:100%;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.fld textarea{resize:vertical;min-height:44px}
.hw{display:flex;gap:5px}
.hw input{width:100%}
.poswrap{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.poschip{
  font-family:var(--mono);font-size:10.5px;padding:2px 6px;border:1px solid var(--rule);
  border-radius:10px;background:#fff;color:var(--ink-2);user-select:none;
}
.poschip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.poschip.main{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{font-size:11px;color:var(--ink-3);margin-top:5px}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--rule);background:var(--card);padding:0 6px}
.tab{
  border:none;background:transparent;padding:7px 11px;
  font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);border-bottom:2px solid transparent;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle;opacity:.55}

/* grid */
.tblwrap{overflow-x:auto}
table.stats{border-collapse:separate;border-spacing:0;width:100%;font-family:var(--mono);font-size:12px}
table.stats th{
  position:sticky;top:0;z-index:2;background:var(--ink);color:#eef1f3;
  font-family:var(--cond);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 6px;text-align:right;white-space:nowrap;border-right:1px solid #2b333b;
}
table.stats th.lft{text-align:left}
table.stats td{
  padding:0;border-bottom:1px solid var(--rule-2);border-right:1px solid var(--rule-2);
  text-align:right;white-space:nowrap;
}
table.stats tr:hover td{background:#f8fafb}
table.stats input{
  width:100%;min-width:52px;border:none;background:transparent;padding:4px 6px;
  text-align:right;font-family:var(--mono);font-size:12px;
}
table.stats input.txt{text-align:left;min-width:64px}
table.stats input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff;position:relative;z-index:1}
table.stats select{border:none;background:transparent;padding:3px 4px;width:100%;min-width:62px;font-family:var(--mono);font-size:11.5px}
td.calc{background:var(--calc-bg);color:var(--ink-2)}
td.calc input{color:var(--ink-2)}
td.ovr{background:var(--ovr-soft) !important;color:var(--ovr);font-weight:600}
td.ovr input{color:var(--ovr);font-weight:600}
td.ovr::after{content:"";position:absolute}
tr.career td{background:#e3e8ea;font-weight:600;border-top:2px solid var(--ink)}
tr.career:hover td{background:#dee4e7}
tr.career td.ovr{background:var(--ovr-soft) !important}
tr.combo td{background:#f0f4f2;font-style:italic;color:var(--ink-2)}
tr.combo:hover td{background:#e9efec}
tr.blocked td.blk{
  text-align:left;color:var(--ink-3);font-family:var(--sans);font-size:11.5px;
  font-style:italic;padding:4px 8px;background:#fafbfc;
}
td.act{width:26px;text-align:center;border-right:none}
td.act button{border:none;background:transparent;color:var(--ink-3);padding:2px 5px;font-size:13px;line-height:1}
td.act button:hover{color:var(--bad)}
.leaguecol{color:var(--accent)}

/* paste */
.paste-in textarea{
  width:100%;min-height:110px;font-family:var(--mono);font-size:11.5px;
  border:1px solid var(--rule);border-radius:3px;padding:7px;background:#fff;white-space:pre;
}
.colspec{
  font-family:var(--mono);font-size:11px;background:var(--ink);color:#cfd6dc;
  padding:6px 8px;border-radius:3px;overflow-x:auto;white-space:nowrap;margin-bottom:7px;
}
.colspec b{color:#7fd4c6;font-weight:500}
.paste-actions{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
.paste-actions label{font-size:12px;display:flex;align-items:center;gap:4px;color:var(--ink-2)}
.log{margin-top:8px;font-family:var(--mono);font-size:11px;max-height:150px;overflow-y:auto}
.log div{padding:1px 0}
.log .e{color:var(--bad)}
.log .g{color:var(--ok)}

/* toast + modal */
.toast{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:8px 15px;border-radius:3px;
  font-size:12.5px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.28);
}
.modal{position:fixed;inset:0;background:rgba(20,24,28,.55);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal-box{background:var(--card);border-radius:5px;padding:16px;width:min(420px,100%);box-shadow:0 14px 40px rgba(0,0,0,.3)}
.modal-box h3{margin:0 0 8px;font-family:var(--cond);font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.modal-box p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2)}
.modal-box input{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;margin-bottom:10px}
.modal-acts{display:flex;gap:7px;justify-content:flex-end}
.modal-acts button{padding:5px 12px;border-radius:3px;border:1px solid var(--rule);background:#fff;font-size:12.5px}
.modal-acts button.go{background:var(--accent);border-color:var(--accent);color:#fff}

/* auth + sync */
.sync{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:2px;letter-spacing:.04em;white-space:nowrap}
.sync.idle{background:#2a333c;color:#8d99a4}
.sync.busy{background:#5a4a12;color:#ffd873}
.sync.ok{background:#12402a;color:#6fdca0}
.sync.err{background:#4a1414;color:#ff9b9b}
.sync.off{background:#3a2a12;color:#ffbe6b}
.authbar{
  display:flex;align-items:center;gap:8px;padding:7px 14px;flex-wrap:wrap;
  background:#fff8e6;border-bottom:1px solid #e8d8a8;font-size:12.5px;color:#6b5417;
}
.authbar input{border:1px solid #ddcf9f;border-radius:3px;padding:4px 7px;background:#fff;min-width:170px}
.authbar button{background:var(--accent);color:#fff;border:none;border-radius:3px;padding:5px 12px;font-size:12.5px}
.authbar .msg{color:var(--bad)}
.authbar.hide{display:none}
.locked .mainscroll,.locked .side-head .addrow{opacity:.5;pointer-events:none}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);padding:6px 11px;border-top:1px solid var(--rule-2)}
.legend span{display:flex;align-items:center;gap:4px}
.sw{width:11px;height:11px;border-radius:2px;border:1px solid var(--rule)}
.sw.c{background:var(--calc-bg)}
.sw.o{background:var(--ovr-soft);border-color:var(--ovr)}
.sw.k{background:#e3e8ea;border-color:var(--ink)}

@media (max-width:820px){
  .side{width:180px;flex-basis:180px}
  .bio-grid{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <span class="brand">Player Stat Entry</span>
    <span class="buildtag">ENTRY BUILD 2 · FIREBASE</span>
    <button class="tbtn" id="btnUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="tbtn" id="btnRedo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    <span class="spacer"></span>
    <span class="sync idle" id="syncChip">connecting…</span>
    <span class="stat-chip" id="chipCount">0 players · 0 rows</span>
    <button class="tbtn" id="btnImport">Import JSON</button>
    <button class="tbtn primary" id="btnExport">Export JSON</button>
    <button class="tbtn" id="btnSignOut" style="display:none">Sign out</button>
    <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
  </div>

  <div class="authbar hide" id="authbar">
    <span id="authLabel">Sign in to edit. Without signing in you can read and export, but not save.</span>
    <input type="email" id="authEmail" placeholder="email" autocomplete="username">
    <input type="password" id="authPass" placeholder="password" autocomplete="current-password">
    <button id="btnSignIn">Sign in</button>
    <span class="msg" id="authMsg"></span>
  </div>

  <div class="body">
    <aside class="side">
      <div class="side-head">
        <input type="text" id="search" placeholder="Search players…">
        <div class="addrow">
          <input type="text" id="newName" placeholder="Add player by name…">
          <button id="btnAddPlayer">Add</button>
        </div>
      </div>
      <div class="plist" id="plist"></div>
    </aside>

    <main class="main">
      <div class="mainscroll" id="mainscroll">
        <div id="playerPane"></div>

        <section class="panel">
          <h2>Bulk paste — many players at once</h2>
          <div class="panel-in paste-in">
            <div class="colspec" id="colspec"></div>
            <textarea id="pasteBox" placeholder="Paste tab-separated rows here (straight from a spreadsheet). One row per player-season-team."></textarea>
            <div class="paste-actions">
              <select id="pasteSection" class="mini"></select>
              <label><input type="checkbox" id="pasteHeader"> First row is a header</label>
              <button class="mini" id="btnPaste">Import rows</button>
              <button class="mini" id="btnPasteClear">Clear</button>
            </div>
            <div class="log" id="pasteLog"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
"use strict";

/* ============================================================
   0. FIREBASE CONFIG
   ============================================================ */

const FB_CONFIG = {
  apiKey:            "AIzaSyDykV8iQukxY00gDkBllu06bDgqak_6zk4",
  authDomain:        "gridmaster-live.firebaseapp.com",
  databaseURL:       "https://gridmaster-live-default-rtdb.firebaseio.com",
  projectId:         "gridmaster-live",
  storageBucket:     "gridmaster-live.firebasestorage.app",
  messagingSenderId: "186706105208",
  appId:             "1:186706105208:web:0baab38c7a018a86d7ae8d"
};

// Top-level nodes this tool owns. Nothing under /leagues or /game is touched.
const $ = id => document.getElementById(id);

const P_PLAYERS = "players";
const P_INDEX   = "playerIndex";
const P_ALIAS   = "playerAlias";

/* ============================================================
   1. SCHEMA
   ============================================================ */

const POSITIONS = ["QB","RB","FB","WR","TE","OL","OG","OT","C","DL","DT","NT","LB","JACK","MAC","CB","S","DB","K","UNK"];

const DEF_POS  = ["DL","DT","NT","LB","JACK","MAC","DB","CB","S"];
const DB_POS   = ["JACK","MAC","DB","CB","S"];

// Raw (typed) fields. Everything else is derived.
const RAW_FIELDS = [
  // passing
  "comp","att","passYds","passTD","passInt","passLong","sacked","sackYdsLost",
  // rushing
  "car","rushYds","rushTD","rushLong","fum","fumLost",
  // receiving
  "rec","recYds","recTD","recLong",
  // tackles
  "solo","ast","tfl","tflYds","sack","sackYds",
  // pass defense
  "int","intYds","pd",
  // defensive fumbles
  "ff","fr","frYds",
  // defensive misc
  "bk","saf","intTD","fumTD","bkTD",
  // returning
  "kr","krYds","krTD","krLong",
  // kicking
  "fga","fgm","fgLong","xpa","xpm","dkpata","dkpatm","rouge","deuce",
  // scoring
  "twoPt","miscPts",
  // base
  "gp"
];
const RAW = new Set(RAW_FIELDS);

// Longest-play fields aggregate by MAX, not SUM.
const MAX_FIELDS = new Set(["passLong","rushLong","recLong","krLong","fgLong"]);

const n0 = v => (v == null ? 0 : v);
const div = (a,b) => (b == null || b === 0 || a == null ? null : a / b);

// Derived fields. Each takes g(key) -> displayed value of that key at the same scope.
const CALC = {
  compPct   : g => { const r = div(g("comp"), g("att")); return r == null ? null : r * 100; },
  passYPC   : g => div(g("passYds"), g("comp")),
  passYPA   : g => div(g("passYds"), g("att")),
  passYPG   : g => div(g("passYds"), g("gp")),
  tdPassPct : g => { const r = div(g("passTD"), g("att")); return r == null ? null : r * 100; },

  rushAvg   : g => div(g("rushYds"), g("car")),
  rushYPG   : g => div(g("rushYds"), g("gp")),

  recAvg    : g => div(g("recYds"), g("rec")),
  recYPG    : g => div(g("recYds"), g("gp")),

  tkl       : g => (g("solo") == null && g("ast") == null) ? null : n0(g("solo")) + n0(g("ast")),

  defTD     : g => (g("intTD") == null && g("fumTD") == null && g("bkTD") == null)
                    ? null : n0(g("intTD")) + n0(g("fumTD")) + n0(g("bkTD")),

  krYPR     : g => div(g("krYds"), g("kr")),

  fgPct     : g => { const r = div(g("fgm"), g("fga")); return r == null ? null : r * 100; },
  xpPct     : g => { const r = div(g("xpm"), g("xpa")); return r == null ? null : r * 100; },
  dkPct     : g => { const r = div(g("dkpatm"), g("dkpata")); return r == null ? null : r * 100; },
  kickPts   : g => {
    const keys = ["fgm","xpm","dkpatm","rouge","deuce"];
    if (keys.every(k => g(k) == null)) return null;
    return n0(g("fgm"))*3 + n0(g("xpm")) + n0(g("dkpatm"))*2 + n0(g("rouge")) + n0(g("deuce"))*2;
  },

  apYds     : g => {
    const keys = ["rushYds","recYds","krYds"];
    if (keys.every(k => g(k) == null)) return null;
    return n0(g("rushYds")) + n0(g("recYds")) + n0(g("krYds"));
  },

  pts       : g => {
    const keys = ["rushTD","recTD","krTD","intTD","fumTD","bkTD","xpm","dkpatm","fgm","twoPt","saf","rouge","deuce","miscPts"];
    if (keys.every(k => g(k) == null)) return null;
    const tds = n0(g("rushTD")) + n0(g("recTD")) + n0(g("krTD")) + n0(g("intTD")) + n0(g("fumTD")) + n0(g("bkTD"));
    return tds*6 + n0(g("xpm")) + n0(g("dkpatm"))*2 + n0(g("fgm"))*3
         + n0(g("twoPt"))*2 + n0(g("saf"))*2 + n0(g("rouge")) + n0(g("deuce"))*2 + n0(g("miscPts"));
  },
  ptsPG     : g => div(CALC.pts(g), g("gp"))
};

// fmt: 'i' integer · 'd1' one decimal · 'p1' percent one decimal
const SECTIONS = [
  { id:"passing", name:"Passing", pos:["QB"], cols:[
    {k:"comp",l:"COMP"},{k:"att",l:"ATT"},{k:"compPct",l:"COMP%",f:"p1"},
    {k:"passYds",l:"PASS YDS"},{k:"passYPC",l:"YPC",f:"d1"},{k:"passYPA",l:"YPA",f:"d1"},{k:"passYPG",l:"YPG",f:"d1"},
    {k:"passTD",l:"PASS TD"},{k:"passInt",l:"INT"},{k:"tdPassPct",l:"TD%",f:"p1"},
    {k:"passLong",l:"LONG"},{k:"sacked",l:"SACKED"},{k:"sackYdsLost",l:"YDS LOST"}
  ]},
  { id:"rushing", name:"Rushing", pos:["RB","FB"], cols:[
    {k:"car",l:"CAR"},{k:"rushYds",l:"RUSH YDS"},{k:"rushAvg",l:"AVG",f:"d1"},{k:"rushYPG",l:"YPG",f:"d1"},
    {k:"rushTD",l:"RUSH TD"},{k:"rushLong",l:"LONG"},{k:"fum",l:"FUM"},{k:"fumLost",l:"LOST"}
  ]},
  { id:"receiving", name:"Receiving", pos:["WR","TE"], cols:[
    {k:"rec",l:"REC"},{k:"recYds",l:"REC YDS"},{k:"recAvg",l:"AVG",f:"d1"},{k:"recYPG",l:"YPG",f:"d1"},
    {k:"recTD",l:"REC TD"},{k:"recLong",l:"LONG"}
  ]},
  { id:"tackles", name:"Tackles", pos:DEF_POS, cols:[
    {k:"tkl",l:"TKL"},{k:"solo",l:"SOLO"},{k:"ast",l:"AST"},
    {k:"tfl",l:"TFL"},{k:"tflYds",l:"TFL YDS"},{k:"sack",l:"SACK",f:"d1"},{k:"sackYds",l:"SACK YDS"}

/* ============================================================
   2. STATE

const DB = { version:1, players:{}, order:[] };
/* player = {
     pid, name, aliases:[], positions:[], mainPos, htFt, htIn, wt,
     colleges, awards, rows:[ row ], careerOv:{}
   }
   row = { rid, year, league, team, pos, status, st:{}, ov:{} }
*/

let selPid = null;
let activeSection = "passing";
let filterText = "";

const undoStack = [], redoStack = [];
const UNDO_MAX = 80;

function snapshot(pids){
  const list = pids ? (Array.isArray(pids) ? pids : [pids]) : (selPid ? [selPid] : []);
  undoStack.push({ json: JSON.stringify(DB), pids: list });
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack.length = 0;
}
function restore(entry){
  const d = JSON.parse(entry.json);
  DB.players = d.players; DB.order = d.order; DB.version = d.version;
  if (selPid && !DB.players[selPid]) selPid = DB.order[0] || null;
  entry.pids.forEach(markDirty);
}
function undo(){
  if (!undoStack.length) return;
  const cur = undoStack.pop();
  redoStack.push({ json: JSON.stringify(DB), pids: cur.pids });
  restore(cur);
  renderAll(); toast("Undone");
}
function redo(){
  if (!redoStack.length) return;
  const cur = redoStack.pop();
  undoStack.push({ json: JSON.stringify(DB), pids: cur.pids });
  restore(cur);
  renderAll(); toast("Redone");
}

/* ============================================================
   2b. FIREBASE SYNC LAYER
   ============================================================ */

let fbApp = null, db = null, auth = null;
let canWrite = false;          // signed in as an admin
let indexLoaded = false;
const loadedPids = new Set();  // pids whose full doc is in memory
const dirtyPids  = new Set();  // pids awaiting a flush
let flushTimer = null, inFlight = 0;

function setSync(state, text){
  const el = $("syncChip");
  el.className = "sync " + state;
  el.textContent = text;
}

/* --- shape conversion -------------------------------------- */
// Local stats are strings from <input>. Firebase stores numbers.
function numMap(o){
  const out = {};
  Object.keys(o || {}).forEach(k => {
    if (isBlank(o[k])) return;
    const v = num(o[k]);
    if (v != null) out[k] = v;
  });
  return out;
}
function strMap(o){
  const out = {};
  Object.keys(o || {}).forEach(k => { if (!isBlank(o[k])) out[k] = String(o[k]); });
  return out;
}

function playerToFb(p){
  const rows = {};
  p.rows.forEach(r => {
    rows[r.rid] = {
      year:   String(r.year   || ""),
      league: String(r.league || ""),
      team:   String(r.team   || ""),
      pos:    String(r.pos    || ""),
      status: r.status || "entered",
      st: numMap(r.st),
      ov: numMap(r.ov)
    };
  });
  return {
    name:      p.name,
    mainPos:   p.mainPos || "",
    positions: p.positions || [],
    aliases:   p.aliases   || [],
    htFt: String(p.htFt || ""), htIn: String(p.htIn || ""), wt: String(p.wt || ""),
    colleges: String(p.colleges || ""), awards: String(p.awards || ""),
    careerOv: numMap(p.careerOv),
    rows,
    updated: firebase.database.ServerValue.TIMESTAMP
  };
}

function playerFromFb(pid, d){
  const rows = Object.keys(d.rows || {}).map(rid => {
    const r = d.rows[rid];
    return { rid, year:String(r.year||""), league:String(r.league||""), team:String(r.team||""),
             pos:String(r.pos||""), status:r.status||"entered", st:strMap(r.st), ov:strMap(r.ov) };
  });
  return { pid, name:d.name||pid, mainPos:d.mainPos||"", positions:d.positions||[], aliases:d.aliases||[],
           htFt:d.htFt||"", htIn:d.htIn||"", wt:d.wt||"", colleges:d.colleges||"", awards:d.awards||"",
           careerOv:strMap(d.careerOv), rows, _stub:false };
}

function indexEntry(p){
  const yrs = p.rows.map(r => parseInt(r.year,10)).filter(isFinite);
  return {
    n: p.name,
    p: p.mainPos || "",
    a: yrs.length ? Math.min(...yrs) : null,
    b: yrs.length ? Math.max(...yrs) : null,
    r: p.rows.length
  };
}

/* --- writes ------------------------------------------------- */
function markDirty(pid){
  if (!pid || !canWrite) return;
  dirtyPids.add(pid);
  setSync("busy", "saving…");
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}

async function flush(){
  if (!canWrite || !dirtyPids.size) return;
  const pids = [...dirtyPids]; dirtyPids.clear();
  const upd = {};
  pids.forEach(pid => {
    const p = DB.players[pid];
    if (!p){                                        // deleted locally
      upd[P_PLAYERS + "/" + pid] = null;
      upd[P_INDEX   + "/" + pid] = null;
      return;
    }
    upd[P_PLAYERS + "/" + pid] = playerToFb(p);
    upd[P_INDEX   + "/" + pid] = indexEntry(p);
    (p.aliases || []).forEach(a => { if (a !== pid) upd[P_ALIAS + "/" + a] = pid; });
  });
  inFlight++;
  setSync("busy", "saving…");
  try {
    await db.ref().update(upd);
    inFlight--;
    if (!inFlight && !dirtyPids.size) setSync("ok", "saved");
  } catch (err){
    inFlight--;
    pids.forEach(x => dirtyPids.add(x));            // put them back
    setSync("err", "save failed");
    toast("Save failed — " + err.message + ". Changes are still in the tab; Export JSON if you need a backup.");
  }
}

async function deletePlayerRemote(pid){
  if (!canWrite) return;
  try {
    await db.ref().update({
      [P_PLAYERS + "/" + pid]: null,
      [P_INDEX   + "/" + pid]: null
    });
    setSync("ok", "saved");
  } catch (err){ setSync("err", "delete failed"); toast("Delete failed — " + err.message); }
}

/* --- reads -------------------------------------------------- */
function watchIndex(){
  db.ref(P_INDEX).on("value", snap => {
    const idx = snap.val() || {};
    Object.keys(idx).forEach(pid => {
      if (loadedPids.has(pid)) return;              // don't clobber a loaded doc
      const e = idx[pid];
      DB.players[pid] = DB.players[pid] || {
        pid, name:e.n || pid, mainPos:e.p || "", positions:e.p ? [e.p] : [], aliases:[],
        htFt:"", htIn:"", wt:"", colleges:"", awards:"",
        rows:[], careerOv:{}, _stub:true, _yrA:e.a, _yrB:e.b, _rowN:e.r
      };
    });
    Object.keys(DB.players).forEach(pid => {
      if (!idx[pid] && DB.players[pid]._stub) delete DB.players[pid];
    });
    DB.order = Object.keys(DB.players).sort((a,b) => DB.players[a].name.localeCompare(DB.players[b].name));
    indexLoaded = true;
    if (selPid && !DB.players[selPid]) selPid = null;
    renderAll();
  }, err => {
    setSync("err", "read blocked");
    toast("Cannot read /playerIndex — " + err.message);
  });
}

async function loadPlayer(pid){
  if (loadedPids.has(pid) || !DB.players[pid]) return;
  setSync("busy", "loading…");
  try {
    const snap = await db.ref(P_PLAYERS + "/" + pid).get();
    if (snap.exists()) DB.players[pid] = playerFromFb(pid, snap.val());
    else DB.players[pid]._stub = false;
    loadedPids.add(pid);
    setSync(canWrite ? "ok" : "idle", canWrite ? "saved" : "read-only");
    renderAll();
  } catch (err){
    setSync("err", "load failed");
    toast("Could not load " + pid + " — " + err.message);
  }
}

/* --- auth --------------------------------------------------- */
function setLocked(locked){
  document.body.classList.toggle("locked", locked);
  $("authbar").classList.toggle("hide", !locked);
  $("btnSignOut").style.display = locked ? "none" : "";
}

function bootFirebase(){
  try {
    fbApp = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(FB_CONFIG);
    db = firebase.database(); auth = firebase.auth();
  } catch (err){
    setSync("off", "no firebase");
    toast("Firebase failed to start — " + err.message + ". The tool still works locally; use Export JSON.");
    setLocked(false);
    return;
  }

  auth.onAuthStateChanged(async user => {
    if (!user){ canWrite = false; setLocked(true); setSync("idle", "read-only"); return; }
    try {
      const ok = await db.ref("admins/" + user.uid).get();
      canWrite = ok.exists() && ok.val() === true;
    } catch (e){ canWrite = false; }
    if (canWrite){
      setLocked(false); setSync("ok", "saved");
      $("authMsg").textContent = "";
    } else {
      setLocked(true); setSync("err", "not an admin");
      $("authMsg").textContent = "Signed in, but this account is not listed under /admins.";
    }
  });

  watchIndex();
  db.ref(".info/connected").on("value", s => {
    if (!canWrite) return;
    if (!s.val()) setSync("off", "offline");
    else if (dirtyPids.size){ clearTimeout(flushTimer); flush(); }
    else setSync("ok", "saved");
  });
}

$("btnSignIn").addEventListener("click", async () => {
  const e = $("authEmail").value.trim(), p = $("authPass").value;
  if (!e || !p){ $("authMsg").textContent = "Enter an email and password."; return; }
  $("authMsg").textContent = "";
  try { await auth.signInWithEmailAndPassword(e, p); $("authPass").value = ""; }
  catch (err){ $("authMsg").textContent = err.message; }

$("btnSignOut").addEventListener("click", async () => { await flush(); auth.signOut(); });

/* ============================================================
   3. VALUE ENGINE
   ============================================================ */

const num = v => { const x = parseFloat(v); return isFinite(x) ? x : null; };
const isBlank = v => v === undefined || v === null || v === "";

function rowActive(row){ return row.status === "entered"; }

// Displayed value of `key` for a single season row (override-aware).
function rowVal(row, key){
  if (row.ov && !isBlank(row.ov[key])) return num(row.ov[key]);
  if (RAW.has(key)) return isBlank(row.st[key]) ? null : num(row.st[key]);
  const fn = CALC[key];
  return fn ? fn(k => rowVal(row, k)) : null;
}

// Displayed value of `key` aggregated over `rows`, honouring an override store.
function aggVal(rows, key, ovStore){
  if (ovStore && !isBlank(ovStore[key])) return num(ovStore[key]);
  if (RAW.has(key)){
    const vals = rows.filter(rowActive).map(r => rowVal(r, key)).filter(v => v != null);
    if (!vals.length) return null;
    return MAX_FIELDS.has(key) ? Math.max(...vals) : vals.reduce((a,b) => a + b, 0);
  }
  const fn = CALC[key];
  return fn ? fn(k => aggVal(rows, k, ovStore)) : null;
}

function isOverridden(store, key){ return store && !isBlank(store[key]); }

function fmt(v, f){
  if (v == null) return "";
  if (f === "d1" || f === "p1") return (Math.round(v * 10) / 10).toFixed(1);
  return Number.isInteger(v) ? String(v) : String(Math.round(v * 10) / 10);
}

/* ============================================================
   4. PLAYER IDENTITY
   ============================================================ */

function slugify(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
          .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "player";
}
function pidExists(pid){
  if (DB.players[pid]) return true;
  return DB.order.some(p => (DB.players[p].aliases || []).includes(pid));
}
function findByName(name){
  const t = name.trim().toLowerCase();
  return DB.order.filter(p => DB.players[p].name.trim().toLowerCase() === t);
}
function newRid(){ return "r" + Math.random().toString(36).slice(2,9); }

function createPlayer(name, tag){
  let base = slugify(name);
  let pid = tag ? base + "-" + slugify(tag) : base;
  if (pidExists(pid)) return { error:"An ID of “" + pid + "” already exists. Pick a different tag." };
  const p = { pid, name:name.trim(), aliases:[], positions:[], mainPos:"",
              htFt:"", htIn:"", wt:"", colleges:"", awards:"", rows:[], careerOv:{} };
  DB.players[pid] = p;
  DB.order.push(pid);
  DB.order.sort((a,b) => DB.players[a].name.localeCompare(DB.players[b].name));
  return { pid };
}

function renderAll(){ renderList(); renderPlayer(); renderChips(); renderColspec(); }

function renderChips(){
  const rows = DB.order.reduce((a,p) => a + DB.players[p].rows.length, 0);

function renderList(){
  const box = $("plist");
  const t = filterText.trim().toLowerCase();
  const ids = DB.order.filter(p => !t || DB.players[p].name.toLowerCase().includes(t) || p.includes(t));

    box.innerHTML = '<div class="empty">' +
      (DB.order.length ? "No players match that search." : "No players yet. Add one above, or paste a batch below.") +

  box.innerHTML = ids.map(pid => {
    const p = DB.players[pid];
    const yrs = p.rows.map(r => parseInt(r.year,10)).filter(isFinite);
    let lo = yrs.length ? Math.min(...yrs) : p._yrA, hi = yrs.length ? Math.max(...yrs) : p._yrB;
    const span = (lo == null) ? "—" : (lo === hi ? lo : lo + "–" + String(hi).slice(-2));

             '<span class="pn">' + esc(p.name) + '</span>' +

    el.addEventListener("click", () => { selPid = el.dataset.pid; renderAll(); loadPlayer(selPid); }));

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

      '</div>' +
    '</div>' +
  '</section>';
}
function fld(label, inner){ return '<div class="fld"><label>' + label + '</label>' + inner + '</div>'; }

function wireBio(p){
  const bind = (id, key, after) => {
    const el = $(id); if (!el) return;
    el.addEventListener("focus", () => { el._before = el.value; });
    el.addEventListener("change", () => {
      if (el.value === el._before) return;
      snapshot(); p[key] = el.value; if (after) after();
      markDirty(p.pid); renderChips(); renderList();
    });
  };
  bind("bHtFt","htFt"); bind("bHtIn","htIn"); bind("bWt","wt");
  bind("bColl","colleges"); bind("bAwards","awards");

  const nm = $("bName");
  nm.addEventListener("focus", () => { nm._before = nm.value; });
  nm.addEventListener("change", () => {
    const v = nm.value.trim();
    if (!v || v === nm._before) { nm.value = p.name; return; }
    snapshot();
    p.name = v;                       // ID stays frozen; old slug kept as alias
    const oldSlug = slugify(nm._before);
    if (oldSlug !== p.pid && !p.aliases.includes(oldSlug)) p.aliases.push(oldSlug);
    DB.order.sort((a,b) => DB.players[a].name.localeCompare(DB.players[b].name));
    markDirty(p.pid); renderAll(); toast("Renamed — ID stays " + p.pid);
  });

  $("posWrap").addEventListener("click", e => {
    const chip = e.target.closest(".poschip"); if (!chip) return;
    const v = chip.dataset.pos;
    snapshot();
    if (!p.positions.includes(v)) { p.positions.push(v); if (!p.mainPos) p.mainPos = v; }
    else if (p.mainPos !== v) { p.mainPos = v; }
    else { p.positions = p.positions.filter(x => x !== v); p.mainPos = p.positions[0] || ""; }
    markDirty(p.pid); renderAll();
  });

  $("btnDelPlayer").addEventListener("click", () => {
    if (!confirm("Delete " + p.name + " and all " + p.rows.length + " season rows? Undo will bring it back.")) return;
    snapshot();
    const gone = p.pid;
    delete DB.players[gone];
    DB.order = DB.order.filter(x => x !== gone);
    loadedPids.delete(gone);
    selPid = DB.order[0] || null;
    deletePlayerRemote(gone);
    renderAll(); toast("Deleted " + p.name);
  });
}

function renderTabs(p){
  const box = $("tabs");
  box.innerHTML = SECTIONS.map(s => {
    const used = p.rows.some(r => s.cols.some(c => RAW.has(c.k) && !isBlank(r.st[c.k])));
    return '<button class="tab' + (s.id === activeSection ? " on" : "") + '" data-sec="' + s.id + '">' +
             s.name + (used ? '<i class="dot"></i>' : "") + '</button>';
  }).join("");
  box.querySelectorAll(".tab").forEach(el =>
    el.addEventListener("click", () => { activeSection = el.dataset.sec; renderTabs(p); renderGrid(p); renderColspec(); }));
}

const BASE_COLS = [
  {k:"year",   l:"YEAR",   w:56},
  {k:"league", l:"LEAGUE", w:82},
  {k:"team",   l:"TEAM",   w:96},
  {k:"pos",    l:"POS",    w:62},
  {k:"gp",     l:"GP",     w:44}
];

function sortedRows(p){
  return p.rows.slice().sort((a,b) =>
    (parseInt(a.year,10)||0) - (parseInt(b.year,10)||0) ||
    String(a.league).localeCompare(String(b.league)) ||
    String(a.team).localeCompare(String(b.team)));
}

function renderGrid(p){
  const sec  = SEC_BY_ID[activeSection];
  const rows = sortedRows(p);

  let h = '<table class="stats"><thead><tr>';
  BASE_COLS.forEach(c => h += '<th class="lft" style="min-width:' + c.w + 'px">' + c.l + '</th>');
  h += '<th class="lft" style="min-width:100px">ROW STATUS</th>';
  sec.cols.forEach(c => h += '<th>' + c.l + '</th>');
  h += '<th></th></tr></thead><tbody>';

  if (!rows.length){
    h += '<tr><td colspan="' + (BASE_COLS.length + sec.cols.length + 2) +
         '" style="text-align:left;padding:14px;color:var(--ink-3);font-family:var(--sans)">' +
         'No season rows yet. Use “+ Add season row”, or paste a batch below.</td></tr>';
  }

  // group by league+year to detect multi-team seasons
  const groups = {};
  rows.forEach(r => { const k = r.league + "|" + r.year; (groups[k] = groups[k] || []).push(r); });
  const seenGroup = new Set();

  rows.forEach(r => {
    h += rowHtml(r, sec);
    const gk = r.league + "|" + r.year;
    const grp = groups[gk];
    if (grp.length > 1 && grp[grp.length - 1].rid === r.rid && !seenGroup.has(gk)){
      seenGroup.add(gk);
      h += comboHtml(grp, sec);
    }
  });

  if (rows.length) h += careerHtml(p, rows, sec);
  h += '</tbody></table>';
  $("tblwrap").innerHTML = h;
  wireGrid(p);
}

function rowHtml(r, sec){
  const blocked = !rowActive(r);
  let h = '<tr' + (blocked ? ' class="blocked"' : "") + ' data-rid="' + r.rid + '">';

  h += '<td><input class="txt" data-f="year"   value="' + esc(r.year)   + '" placeholder="YYYY"></td>';
  h += '<td><input class="txt leaguecol" data-f="league" value="' + esc(r.league) + '" placeholder="league"></td>';
  h += '<td><input class="txt" data-f="team"   value="' + esc(r.team)   + '" placeholder="team"></td>';
  h += '<td><select data-f="pos"><option value=""></option>' +
       POSITIONS.map(x => '<option' + (r.pos === x ? " selected" : "") + '>' + x + '</option>').join("") +
       '</select></td>';
  h += cellHtml(r, {k:"gp", l:"GP"}, r.ov, v => rowVal(r, v));
  h += '<td><select data-f="status">' +
       Object.keys(STATUS).map(k => '<option value="' + k + '"' + (r.status === k ? " selected" : "") + '>' +
         (k === "entered" ? "Stats entered" : k === "notEntered" ? "Not entered yet" : "Not available") +
       '</option>').join("") + '</select></td>';

  if (blocked){
    h += '<td class="blk" colspan="' + (sec.cols.length + 1) + '">' + STATUS[r.status] + ' — excluded from career totals</td>';
  } else {
    sec.cols.forEach(c => h += cellHtml(r, c, r.ov, k => rowVal(r, k)));
    h += '<td class="act"><button data-act="del" title="Delete row">✕</button></td>';
  }
  return h + '</tr>';
}

function comboHtml(grp, sec){
  const r0 = grp[0];
  let h = '<tr class="combo">';
  h += '<td style="text-align:left;padding:4px 6px">' + esc(r0.year) + '</td>';
  h += '<td class="leaguecol" style="text-align:left;padding:4px 6px">' + esc(r0.league) + '</td>';
  h += '<td style="text-align:left;padding:4px 6px">' + grp.length + 'TM</td>';
  h += '<td style="text-align:left;padding:4px 6px">' + esc(r0.pos) + '</td>';
  h += '<td style="padding:4px 6px">' + fmt(aggVal(grp,"gp",null)) + '</td>';
  h += '<td style="text-align:left;padding:4px 6px;font-family:var(--sans);font-size:11px">combined</td>';
  sec.cols.forEach(c => h += '<td style="padding:4px 6px">' + fmt(aggVal(grp, c.k, null), c.f) + '</td>');
  return h + '<td class="act"></td></tr>';
}

function careerHtml(p, rows, sec){
  const ov = p.careerOv;
  let h = '<tr class="career" data-rid="__career">';
  h += '<td style="text-align:left;padding:4px 6px">CAREER</td>';
  const leagues = [...new Set(rows.filter(rowActive).map(r => r.league).filter(Boolean))];
  h += '<td class="leaguecol" style="text-align:left;padding:4px 6px">' + esc(leagues.length > 1 ? leagues.length + " lg" : leagues[0] || "") + '</td>';
  const teams = new Set(rows.filter(rowActive).map(r => r.team).filter(Boolean));
  h += '<td style="text-align:left;padding:4px 6px">' + teams.size + ' tm</td>';
  h += '<td style="text-align:left;padding:4px 6px">' + esc(p.mainPos) + '</td>';
  h += cellHtml(null, {k:"gp"}, ov, k => aggVal(rows, k, ov));
  h += '<td style="text-align:left;padding:4px 6px;font-family:var(--sans);font-size:11px">' + rows.filter(rowActive).length + ' seasons</td>';
  sec.cols.forEach(c => h += cellHtml(null, c, ov, k => aggVal(rows, k, ov)));
  return h + '<td class="act"></td></tr>';
}

// One editable cell. Raw fields write to .st; derived fields write to the override store.
function cellHtml(row, col, ovStore, getter){
  const k = col.k;
  const raw = RAW.has(k);
  const overridden = isOverridden(ovStore, k);
  const isCareer = row === null;
  let cls = [];
  if (!raw || isCareer) cls.push("calc");
  if (overridden) cls.push("ovr");

  let display;
  if (overridden) display = ovStore[k];
  else if (raw && !isCareer) display = isBlank(row.st[k]) ? "" : row.st[k];
  else display = fmt(getter(k), col.f);

  const target = (raw && !isCareer && !overridden) ? "st" : "ov";
  return '<td class="' + cls.join(" ") + '" style="position:relative">' +
    '<input data-k="' + k + '" data-t="' + target + '" data-raw="' + (raw ? 1 : 0) + '" value="' + esc(display) + '">' +
  '</td>';
}

function wireGrid(p){
  const wrap = $("tblwrap");

  wrap.querySelectorAll("input,select").forEach(el => {
    el.addEventListener("focus", () => { el._before = el.value; });
  });

  wrap.addEventListener("change", e => {
    const el = e.target;
    const tr = el.closest("tr"); if (!tr) return;
    const rid = tr.dataset.rid;
    if (el.value === el._before) return;
    snapshot();

    if (rid === "__career"){
      const k = el.dataset.k;
      if (isBlank(el.value)) delete p.careerOv[k]; else p.careerOv[k] = el.value.trim();
      markDirty(p.pid); renderGrid(p); return;
    }

    const row = p.rows.find(r => r.rid === rid); if (!row) return;

    if (el.dataset.f){                       // base text/select field
      row[el.dataset.f] = el.value.trim();
      markDirty(p.pid);
      if (el.dataset.f === "status") { renderGrid(p); renderTabs(p); }
      renderList(); return;
    }

    const k = el.dataset.k, isRaw = el.dataset.raw === "1";
    if (isRaw){
      if (isOverridden(row.ov, k)){
        // editing an overridden raw cell rewrites the override
        if (isBlank(el.value)) delete row.ov[k]; else row.ov[k] = el.value.trim();
      } else {
        if (isBlank(el.value)) delete row.st[k]; else row.st[k] = el.value.trim();
      }
    } else {
      if (isBlank(el.value)) delete row.ov[k]; else row.ov[k] = el.value.trim();
    }
    markDirty(p.pid);
    renderGrid(p); renderTabs(p); renderChips();
  });

  wrap.addEventListener("click", e => {
    const b = e.target.closest("button[data-act=del]"); if (!b) return;
    const rid = b.closest("tr").dataset.rid;
    const row = p.rows.find(r => r.rid === rid);
    if (!confirm("Delete " + (row.year || "?") + " " + (row.team || "?") + "? Undo will bring it back.")) return;
    snapshot();
    p.rows = p.rows.filter(r => r.rid !== rid);
    markDirty(p.pid); renderAll();
  });

  // Enter moves down the same column, keeping hands off the mouse.
  wrap.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
    e.preventDefault();
    const inputs = [...wrap.querySelectorAll("input")];
    const cellsPerRow = wrap.querySelector("tbody tr").querySelectorAll("input,select").length;
    const i = inputs.indexOf(e.target);
    const next = inputs[i + Math.max(1, cellsPerRow - 1)] || inputs[i + 1];
    if (next) { next.focus(); next.select(); }
  });
}

/* ============================================================
   6. BULK PASTE
   ============================================================ */

function pasteCols(secId){
  const sec = SEC_BY_ID[secId];
  const base = ["NAME","YEAR","LEAGUE","TEAM","POS","GP"];
  const raws = sec.cols.filter(c => RAW.has(c.k) && c.k !== "gp");
  return { base, raws, labels: base.concat(raws.map(c => c.l)) };
}

function renderColspec(){
  const sel = $("pasteSection");
  if (!sel.options.length){
    sel.innerHTML = SECTIONS.filter(s => s.cols.some(c => RAW.has(c.k)))
      .map(s => '<option value="' + s.id + '">' + s.name + '</option>').join("");
  }
  if (sel.value !== activeSection && SEC_BY_ID[activeSection].cols.some(c => RAW.has(c.k))) sel.value = activeSection;
  const spec = pasteCols(sel.value);
  $("colspec").innerHTML = "Column order &nbsp;→&nbsp; " +
    spec.base.map(x => "<b>" + x + "</b>").join(" &nbsp;·&nbsp; ") +
    (spec.raws.length ? " &nbsp;·&nbsp; " + spec.raws.map(c => c.l).join(" &nbsp;·&nbsp; ") : "");
}

const splitCells = line =>
  line.split(/\t|\s{2,}|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g,""));

async function doPaste(){
  const secId = $("pasteSection").value;
  const spec  = pasteCols(secId);
  const text  = $("pasteBox").value.replace(/\r/g, "");
  const log   = $("pasteLog");
  log.innerHTML = "";
  const say = (msg, cls) => log.insertAdjacentHTML("beforeend", '<div class="' + (cls || "") + '">' + esc(msg) + "</div>");

  let lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  if (!lines.length) { say("Nothing to import — the paste box is empty.", "e"); return; }
  if ($("pasteHeader").checked) lines = lines.slice(1);

  // Pull down the full document for every existing player this paste touches.
  // Without this we would merge into an empty stub and wipe their season rows.
  if (db){
    const need = new Set();
    lines.forEach(l => {
      const nm = splitCells(l)[0];
      if (!nm) return;
      findByName(nm).forEach(pid => { if (!loadedPids.has(pid)) need.add(pid); });
    });
    if (need.size){
      say("Loading " + need.size + " existing player" + (need.size === 1 ? "" : "s") + " before merging…");
      setSync("busy", "loading…");
      try { await Promise.all([...need].map(loadPlayer)); }
      catch (err){ say("Could not load existing players — import aborted. " + err.message, "e"); return; }
    }
  }

  const touched = new Set();
  snapshot([]);
  let added = 0, updated = 0, madePlayers = 0;
  const ambiguous = [];

  lines.forEach((line, idx) => {
    const cells = splitCells(line);
    const [name, year, league, team, pos, gp] = cells;
    if (!name) { say("Line " + (idx+1) + ": no player name — skipped.", "e"); return; }

    const matches = findByName(name);
    let pid;
    if (matches.length === 1) pid = matches[0];
    else if (matches.length === 0){
      const res = createPlayer(name);
      if (res.error) { say("Line " + (idx+1) + ": " + res.error, "e"); return; }
      pid = res.pid; madePlayers++; loadedPids.add(pid); DB.players[pid]._stub = false;
    } else {
      ambiguous.push(name);
      say("Line " + (idx+1) + ": “" + name + "” matches " + matches.length + " players — skipped, resolve by hand.", "e");
      return;
    }

    const p = DB.players[pid];
    let row = p.rows.find(r => r.year === String(year) && r.league === String(league||"") && r.team === String(team||""));
    if (!row){
      row = { rid:newRid(), year:String(year||""), league:String(league||""), team:String(team||""),
              pos:String(pos||""), status:"entered", st:{}, ov:{} };
      p.rows.push(row); added++;
    } else updated++;

    if (pos) row.pos = String(pos);
    if (!isBlank(gp)) row.st.gp = String(gp);
    if (pos && !p.positions.includes(pos)) { p.positions.push(pos); if (!p.mainPos) p.mainPos = pos; }

    spec.raws.forEach((c, i) => {
      const v = cells[6 + i];
      if (!isBlank(v)) row.st[c.k] = v;
    });
    row.status = "entered";
    touched.add(pid);
  });

  DB.order.sort((a,b) => DB.players[a].name.localeCompare(DB.players[b].name));
  undoStack[undoStack.length - 1].pids = [...touched];
  touched.forEach(markDirty);
  say(added + " rows added · " + updated + " rows updated · " + madePlayers + " new players created", "g");
  if (ambiguous.length) say("Duplicate names needing a disambiguator tag: " + [...new Set(ambiguous)].join(", "), "e");
  renderAll();
  if (canWrite){ clearTimeout(flushTimer); flush(); }
}

/* ============================================================
   7. IMPORT / EXPORT / MISC
   ============================================================ */

async function exportJSON(){
  const stubs = DB.order.filter(pid => DB.players[pid]._stub);
  if (stubs.length){
    if (!confirm(stubs.length + " players haven't been loaded in this session. Fetch them now so the backup is complete?")) return;
    setSync("busy", "loading " + stubs.length + "…");
    try { for (const pid of stubs) await loadPlayer(pid); }
    catch (err){ toast("Export aborted — " + err.message); return; }
    setSync(canWrite ? "ok" : "idle", canWrite ? "saved" : "read-only");
  }
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gridmaster-players-" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Exported " + DB.order.length + " players");
}

function importJSON(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d.players || !d.order) throw new Error("not a player file");
      if (canWrite && !confirm("Importing replaces the whole player database in this tab and pushes it to Firebase, overwriting " + DB.order.length + " players there. Continue?")) return;
      snapshot(Object.keys(d.players));
      DB.players = d.players; DB.order = d.order; DB.version = d.version || 1;
      DB.order.forEach(pid => {
        const p = DB.players[pid];
        p.rows = p.rows || []; p.careerOv = p.careerOv || {}; p.aliases = p.aliases || [];
        p._stub = false; loadedPids.add(pid);
        p.rows.forEach(r => { r.st = r.st || {}; r.ov = r.ov || {}; r.status = r.status || "entered"; r.rid = r.rid || newRid(); });
        markDirty(pid);
      });
      selPid = DB.order[0] || null;
      renderAll(); toast("Imported " + DB.order.length + " players");
    } catch (err){
      toast("Import failed — " + err.message);
    }
  };
  fr.readAsText(file);
}

let toastTimer;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const d = document.createElement("div");
  d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => d.remove(), 2400);
}

function askTag(name, onOk){
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML =
    '<div class="modal-box">' +
      '<h3>Name already taken</h3>' +
      '<p>A player with the ID <b>' + esc(slugify(name)) + '</b> already exists. ' +
      'Add a short tag to tell them apart — a position, a birth year, whatever you\'ll recognise later.</p>' +
      '<input type="text" id="tagIn" placeholder="e.g. lb, 1998, jr">' +
      '<div class="modal-acts"><button id="tagCancel">Cancel</button><button class="go" id="tagOk">Create player</button></div>' +
    '</div>';
  document.body.appendChild(wrap);
  const inp = wrap.querySelector("#tagIn"); inp.focus();
  const close = () => wrap.remove();
  wrap.querySelector("#tagCancel").addEventListener("click", close);
  wrap.querySelector("#tagOk").addEventListener("click", () => {
    const t = inp.value.trim(); if (!t) { inp.focus(); return; }
    close(); onOk(t);
  });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") wrap.querySelector("#tagOk").click(); });
}

function addPlayerFlow(){
  const name = $("newName").value.trim();
  if (!name) { $("newName").focus(); return; }
  const attempt = tag => {
    snapshot();
    const res = createPlayer(name, tag);
    if (res.error) { undoStack.pop(); toast(res.error); return; }
    selPid = res.pid; $("newName").value = "";
    loadedPids.add(res.pid); DB.players[res.pid]._stub = false;
    markDirty(res.pid);
    renderAll(); toast("Added " + name + " — ID " + res.pid);
  };
  if (pidExists(slugify(name))) askTag(name, attempt); else attempt(null);
}

/* ============================================================
   8. BOOT
   ============================================================ */

$("btnAddPlayer").addEventListener("click", addPlayerFlow);
$("newName").addEventListener("keydown", e => { if (e.key === "Enter") addPlayerFlow(); });
$("search").addEventListener("input", e => { filterText = e.target.value; renderList(); });
$("btnUndo").addEventListener("click", undo);
$("btnRedo").addEventListener("click", redo);
$("btnExport").addEventListener("click", exportJSON);
$("btnImport").addEventListener("click", () => $("fileIn").click());
$("fileIn").addEventListener("change", e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ""; });
$("btnPaste").addEventListener("click", doPaste);
$("btnPasteClear").addEventListener("click", () => { $("pasteBox").value = ""; $("pasteLog").innerHTML = ""; });
$("pasteSection").addEventListener("change", renderColspec);

document.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  if (e.key.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
});

window.addEventListener("beforeunload", e => {
  if (dirtyPids.size || inFlight){ e.preventDefault(); e.returnValue = ""; }
});

renderAll();
bootFirebase();
